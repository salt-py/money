[project]
name = "money"
version = "0.1.0"
description = "Local-only personal finance tracker"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "pdfplumber>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fpdf2>=2.7"]

[tool.pytest.ini_options]
pythonpath = ["src"]
